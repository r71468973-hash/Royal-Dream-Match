name: Build Android APK (Royal Dream Match)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          # 1. Configure and export ANDROID_HOME
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_ROOT" ]; then
            ANDROID_ROOT="$HOME/android-sdk"
            mkdir -p "$ANDROID_ROOT"
          fi
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          export ANDROID_HOME="$ANDROID_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_ROOT"

          # 2. Locate or install Command-line Tools (sdkmanager)
          SDKMANAGER_BIN=""
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          else
            EXISTING=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | grep -E 'cmdline-tools/(latest|[0-9.]+)/bin/sdkmanager' | head -n 1)
            if [ -n "$EXISTING" ]; then
              SDKMANAGER_BIN=$(dirname "$EXISTING")
            else
              echo "Downloading Android Command-line tools..."
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              curl -sS -L -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-extracted
              mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
              cp -r /tmp/cmdline-extracted/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/" || true
              SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
            fi
          fi

          # 3. Export PATH to GitHub Environment
          echo "$SDKMANAGER_BIN" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          export PATH="$SDKMANAGER_BIN:$ANDROID_HOME/platform-tools:$PATH"

          # 4. Accept Android SDK Licenses
          echo "Accepting Android SDK licenses..."
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER_BIN/sdkmanager" --licenses || true

          # 5. Install Android SDK Platforms and Build Tools
          echo "Installing platforms and build tools..."
          "$SDKMANAGER_BIN/sdkmanager" --install "platform-tools" "cmdline-tools;latest" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true

          # 6. Configure local.properties for Gradle
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Android SDK configured successfully at $ANDROID_HOME"

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Safely Install Node Dependencies
        run: |
          echo "Installing dependencies with Node $(node -v) and npm $(npm -v)..."
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Configure Keystore for Release Signing
        run: |
          mkdir -p android/app
          if [ ! -f android/app/royal-dream-match-release.keystore ]; then
            echo "Generating production release signing keystore..."
            keytool -genkey -v -keystore android/app/royal-dream-match-release.keystore -alias royaldreammatch -keypass RoyalMatch2026Production! -storepass RoyalMatch2026Production! -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Royal Dream Match,OU=Production,O=Royal Dream Match,C=US"
          fi
          echo "Production keystore is ready at android/app/royal-dream-match-release.keystore"
        env:
          RELEASE_STORE_PASSWORD: RoyalMatch2026Production!
          RELEASE_KEY_ALIAS: royaldreammatch
          RELEASE_KEY_PASSWORD: RoyalMatch2026Production!

      - name: Build Android APK
        run: |
          cd android
          echo "Building Release APK..."
          if ./gradlew assembleRelease --no-daemon -x lint -x test --stacktrace; then
            echo "Release APK built successfully."
          else
            echo "Release APK build failed, building Debug APK fallback..."
            ./gradlew assembleDebug --no-daemon -x lint -x test --stacktrace
          fi
        env:
          RELEASE_STORE_PASSWORD: RoyalMatch2026Production!
          RELEASE_KEY_ALIAS: royaldreammatch
          RELEASE_KEY_PASSWORD: RoyalMatch2026Production!

      - name: Build Release AAB (Android App Bundle for Google Play Console)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -x lint -x test --stacktrace || true
        env:
          RELEASE_STORE_PASSWORD: RoyalMatch2026Production!
          RELEASE_KEY_ALIAS: royaldreammatch
          RELEASE_KEY_PASSWORD: RoyalMatch2026Production!

      - name: Package & Verify APK Artifacts
        id: package-artifacts
        run: |
          mkdir -p build-artifacts

          # 1. Locate and copy APK to Royal-Dream-Match.apk
          APK_SOURCE=""
          for candidate in \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/*.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/*.apk; do
            if [ -f "$candidate" ]; then
              APK_SOURCE="$candidate"
              echo "Found target APK at: $APK_SOURCE"
              break
            fi
          done

          if [ -z "$APK_SOURCE" ]; then
            echo "Searching all android/app/build outputs for any generated .apk..."
            APK_SOURCE=$(find android/app/build -name "*.apk" -type f | head -n 1)
          fi

          if [ -n "$APK_SOURCE" ] && [ -f "$APK_SOURCE" ]; then
            cp -v "$APK_SOURCE" build-artifacts/Royal-Dream-Match.apk
          fi

          # Requirement 15: Verify that the APK exists before uploading
          if [ ! -f build-artifacts/Royal-Dream-Match.apk ]; then
            echo "FATAL: Royal-Dream-Match.apk does not exist! Build failed to generate an APK."
            exit 1
          fi

          echo "SUCCESS: Royal-Dream-Match.apk verified!"
          ls -lh build-artifacts/Royal-Dream-Match.apk

          # 2. Locate and copy AAB if generated
          for aab in android/app/build/outputs/bundle/release/*.aab; do
            if [ -f "$aab" ]; then
              echo "Found target AAB at: $aab"
              cp -v "$aab" build-artifacts/Royal-Dream-Match.aab
              break
            fi
          done

          # 3. Package Live OTA Web Bundle
          cd dist
          zip -r ../build-artifacts/dist-ota-latest.zip .
          cd ..
          cp public/ota-manifest.json build-artifacts/ota-manifest.json

          echo "Generated build artifacts:"
          ls -la build-artifacts/

      - name: Upload Royal-Dream-Match-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Dream-Match-APK
          path: build-artifacts/Royal-Dream-Match.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Royal-Dream-Match-AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Royal-Dream-Match-AAB
          path: build-artifacts/Royal-Dream-Match.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Automatic GitHub Release with APK, AAB & OTA Bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: |
            build-artifacts/Royal-Dream-Match.apk
            build-artifacts/Royal-Dream-Match.aab
            build-artifacts/dist-ota-latest.zip
            build-artifacts/ota-manifest.json
          name: Royal Dream Match ${{ github.ref_name || 'v1.0.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          body: |
            ## 👑 Royal Dream Match Android Release (APK & AAB)
            
            - **Download APK Directly**: [`Royal-Dream-Match.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}/Royal-Dream-Match.apk)
            - **Google Play App Bundle**: `Royal-Dream-Match.aab`
            - **Package Name**: `com.royaldream.match`
            - **App Name**: Royal Dream Match
            - **Launcher Icon**: Royal Dream Match Emblem (all mipmap densities)
            - **AdMob Integration**: Google Mobile Ads SDK (Banner, Interstitial & Rewarded)
            - **Version**: `1.0.0`
            - **Built with**: Node.js 22 LTS, Java 21, and Capacitor Android
            
            ### Quick Installation:
            1. Download `Royal-Dream-Match.apk` directly to your Android device.
            2. Tap to install (enable "Install unknown apps" if prompted).
            3. Enjoy Royal Dream Match with 100 royal levels, boosters, and custom launcher icon!
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Release Upload via GitHub CLI
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}"
          echo "Ensuring release asset is attached via gh CLI for tag $TAG..."
          if gh release view "$TAG" 2>/dev/null; then
            echo "Uploading APK to existing release $TAG..."
            gh release upload "$TAG" build-artifacts/Royal-Dream-Match.apk --clobber || true
          else
            echo "Creating release $TAG with APK..."
            gh release create "$TAG" build-artifacts/Royal-Dream-Match.apk \
              --title "Royal Dream Match $TAG" \
              --notes "👑 Royal Dream Match Android Release (APK)" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK (Royal Dream Match)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          # 1. Configure and export ANDROID_HOME
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_ROOT" ]; then
            ANDROID_ROOT="$HOME/android-sdk"
            mkdir -p "$ANDROID_ROOT"
          fi
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          export ANDROID_HOME="$ANDROID_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_ROOT"

          # 2. Locate or install Command-line Tools (sdkmanager)
          SDKMANAGER_BIN=""
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          else
            EXISTING=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | grep -E 'cmdline-tools/(latest|[0-9.]+)/bin/sdkmanager' | head -n 1)
            if [ -n "$EXISTING" ]; then
              SDKMANAGER_BIN=$(dirname "$EXISTING")
            else
              echo "Downloading Android Command-line tools..."
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              curl -sS -L -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-extracted
              mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
              cp -r /tmp/cmdline-extracted/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/" || true
              SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
            fi
          fi

          # 3. Export PATH to GitHub Environment
          echo "$SDKMANAGER_BIN" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          export PATH="$SDKMANAGER_BIN:$ANDROID_HOME/platform-tools:$PATH"

          # 4. Accept Android SDK Licenses
          echo "Accepting Android SDK licenses..."
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER_BIN/sdkmanager" --licenses || true

          # 5. Install Android SDK Platform 36 (required by AndroidX 1.11.0 / 1.17.0), 35, 34 & Build Tools
          echo "Installing platforms (including android-36) and build tools..."
          "$SDKMANAGER_BIN/sdkmanager" --install "platform-tools" "cmdline-tools;latest" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true

          # 6. Verify sdkmanager --list works
          echo "Verifying sdkmanager installation..."
          "$SDKMANAGER_BIN/sdkmanager" --list | head -n 25

          # 7. Configure local.properties for Gradle
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Android SDK configured successfully at $ANDROID_HOME"

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Safely Install Node Dependencies
        run: |
          echo "Installing dependencies with Node $(node -v) and npm $(npm -v)..."
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Configure Keystore for Release Signing
        run: |
          mkdir -p android/app
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating release signing keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RoyalDreamMatch,OU=Game,O=RoyalMatch,C=US"
          fi
          echo "Keystore is ready at android/app/debug.keystore"

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x test --stacktrace

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -x lint -x test --stacktrace

      - name: Package Artifacts
        run: |
          mkdir -p build-artifacts

          # Locate and copy APK to Royal-Dream-Match.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/Royal-Dream-Match.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/Royal-Dream-Match.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Royal-Dream-Match.apk
          fi

          # Locate and copy AAB to Royal-Dream-Match.aab
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-artifacts/Royal-Dream-Match.aab
          elif [ -f android/app/build/outputs/bundle/release/app-release-unsigned.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release-unsigned.aab build-artifacts/Royal-Dream-Match.aab
          fi

          echo "Generated build artifacts:"
          ls -la build-artifacts/

      - name: Upload Royal-Dream-Match-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Dream-Match-APK
          path: build-artifacts/Royal-Dream-Match.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Royal-Dream-Match-AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Royal-Dream-Match-AAB
          path: build-artifacts/Royal-Dream-Match.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Automatic GitHub Release with APK & AAB
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: |
            build-artifacts/Royal-Dream-Match.apk
            build-artifacts/Royal-Dream-Match.aab
          name: Royal Dream Match ${{ github.ref_name || 'v1.0.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          body: |
            ## 👑 Royal Dream Match Android APK
            
            - **APK File**: `Royal-Dream-Match.apk`
            - **Package Name**: `com.royaldream.match`
            - **Version**: `1.0.0`
            - **Launcher Icon**: 👑 Golden Royal Crown with Match-3 Jewels (512x512 adaptive icon)
            - **Built with**: Node.js 22 LTS, Java 21, and Capacitor Android
            
            ### Installation:
            1. Download `Royal-Dream-Match.apk`
            2. Tap to install on your Android device
            3. Enjoy Royal Dream Match with full audio, 100 levels, and custom launcher icon!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
